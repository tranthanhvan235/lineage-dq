# Business metadata for the orders example. The Gen Rules agent reads the whole file; only
# columns[].name and columns[].no_value_when are parsed structurally.

dataset_name: customer_monthly
description: >
  Monthly revenue per customer from completed orders. One row per (customer, month) with at
  least one completed order.
owner: "example"
source_reference: >
  examples/orders/job.py. Joins orders with the customer table, keeps completed orders,
  computes net amounts and aggregates by customer and month.

tables:
  - table: orders
    role: input
    grain: One row per order, key order_id.
  - table: customers
    role: input
    grain: One row per customer, key customer_id.
  - table: customer_monthly
    role: output
    grain: One row per (customer_id, order_month).

domain_constants:
  period: ["2026-01-01", "2026-07-01"]
  statuses: ["completed", "cancelled", "returned"]
  segments: ["consumer", "corporate", "small_business"]
  discount_range: [0, 0.5]

columns:
  - name: order_id
    description: Order identifier, unique.
  - name: customer_id
    description: Customer of the order; must exist in the customer table.
  - name: order_date
    description: Order date, yyyy-MM-dd, inside the data period.
  - name: status
    description: Order status, see domain_constants.statuses.
  - name: quantity
    description: Number of items, > 0.
  - name: unit_price
    description: Price per item, > 0.
  - name: discount
    description: Discount rate applied to the order, see domain_constants.discount_range.
  - name: customer_code
    description: Business code of the customer, C followed by 5 digits.
    no_value_when: The order's customer_id is not in the customer table (left join).
  - name: segment
    description: Customer segment, see domain_constants.segments.
    no_value_when: The order's customer_id is not in the customer table (left join).
  - name: region
    description: Sales region of the customer.
  - name: gross_amount
    description: quantity * unit_price.
  - name: net_amount
    description: gross_amount * (1 - discount), rounded to 2 decimals; <= gross_amount.
  - name: order_month
    description: Month of order_date, yyyy-MM.
  - name: order_count
    description: Number of completed orders in the group, > 0.
  - name: total_quantity
    description: Sum of quantity over the group.
  - name: net_revenue
    description: Sum of net_amount over the group.

invariants:
  - "net_amount = round(quantity * unit_price * (1 - discount), 2)"
  - "order_month = substring(order_date, 1, 7)"
  - "output: (customer_id, order_month) is unique"
